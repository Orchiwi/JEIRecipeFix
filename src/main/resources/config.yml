# JEIRecipeFix configuration.

# Master switch. When false, no recipes are sent.
enabled: true

# Send recipes automatically when a player joins.
sync-on-join: true

# Re-send recipes to online players after a datapack reload.
sync-on-datapack-reload: true

# After sending the recipes, ask the client to re-read them.
# JEI builds its recipe list the moment the server's own recipe packet arrives, which is before any
# plugin can send anything, so without this it keeps showing your client's default recipes for the
# whole session. Only sent to clients that report both Fabric's recipe-sync channel and JEI.
# Turn this off if a recipe viewer misbehaves; recipes are then only correct after a rejoin.
recipe-update-trigger: true

# Send the server's full recipe book to the client.
# This is the only thing REI reads: it builds its recipe list from the vanilla recipe-book packet,
# and a server normally sends only the recipes a player has already unlocked, which is why REI looks
# empty. The side effect is that the player's own recipe book lists every recipe as known.
#   auto - only clients that report REI (recommended)
#   all  - every Fabric/NeoForge client, for recipe viewers this plugin cannot detect
#   off  - never
recipe-book-sync: auto

# Let players use the "craft this" button on a recipe.
# The button that moves a recipe's ingredients into the crafting grid — in the vanilla recipe book,
# and REI's, which uses the same mechanism — only works for recipes the server has marked as known
# for that player. This unlocks them all, so the button works everywhere. The server still does the
# moving itself and still checks everything it normally checks.
# Off by default because, unlike the rest of this plugin, it writes to the player's saved data.
# Ignored in a world using the doLimitedCrafting gamerule, which exists to gate recipes on purpose.
# /jrf revoke [player|all] undoes it.
unlock-recipes: false

# Tell the player their recipes are synced.
# A recipe viewer can warn that the server provides no recipes before any plugin is allowed to send
# anything, and that warning stays on screen after the recipes have quietly arrived. This sends one
# chat line saying so, once per join, and only to players whose client actually received the recipes
# and was identified as running a recipe viewer. The wording lives in messages.yml under
# jei-warning-notice.
explain-jei-warning: true

# Verbose logging for troubleshooting (per-player brand + recipe counts).
debug: false
