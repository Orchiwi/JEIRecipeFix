prefix: "&8[&bJEIRecipeFix&8]&r "
no-permission: "&cYou don't have permission to do that."
reload-success: "&aConfiguration reloaded."
resync-self: "&aRecipes re-sent to you."
resync-player: "&aRecipes re-sent to &e%player%&a."
resync-all: "&aRecipes re-sent to &e%count%&a player(s)."
player-not-found: "&cPlayer &e%player% &cnot found."
recipe-sync-dormant: "&cRecipe sync is dormant (unsupported server internals)."
info-line: "&7Recipes: &f%recipes% &7| Online players: &f%players% &7| Sync: &f%state% &7| Recipe-update trigger: &f%trigger% &7| Send failures: &f%failures%"
unknown-subcommand: "&cUnknown subcommand. Use &e/jrf help&c."
help: "&bJEIRecipeFix: &e/jrf resync [player|all]&7, &e/jrf reload&7, &e/jrf info"
# Sent to players whose client just received the recipes and runs a recipe viewer.
# "if present" is deliberate: only JEI 30.8.0.51 / 29.14.0.43 and newer print that warning, and a
# server cannot see which version of which viewer a player is running.
jei-warning-notice: "&aRecipes synced. &7Ignore the JEI/REI/EMI warning above if present."
# Sent once to a player whose Minecraft version differs from the server's and who runs JEI. Their
# recipe viewer cannot be given the server's recipes: that data is tied to the server's own version.
cross-version-notice: "&eYour Minecraft version is not the server's. &7Your recipe viewer cannot receive the server's recipes — join on the server's version to see them."
# Shown by /jrf info.
info-cross-version: "&7Server protocol: &f%protocol% &7| ViaVersion: &f%via% &7| Players on another version: &f%translated%"
