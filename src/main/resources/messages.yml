# Sent to players whose client just received the recipes and runs a recipe viewer.
# Deliberately names no particular viewer, and says "any warning" rather than "the warning": only
# JEI 30.8.0.51 / 29.14.0.43 and newer print one, and a server cannot see which version a player has.
jei-warning-notice: "&aRecipes synced. &7Your recipe viewer is showing the recipes this server uses — ignore any warning above that says otherwise."
