# Sent to players whose client just received the recipes and is known to have JEI.
# Worded so it also reads correctly for a client whose JEI is old enough not to print that warning:
# the server cannot see a client mod's version, so it cannot tell the two apart.
jei-warning-notice: "&aServer recipes synced to JEI. &7If JEI warned otherwise above, that warning is out of date."
