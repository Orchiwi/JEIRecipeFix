name: Release to Modrinth

on:
  push:
    tags:
      - 'v*'
  # Lets the project page be re-synced from README.md without cutting a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match gradle.properties version $version" >&2
            exit 1
          fi

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth --no-daemon --no-configuration-cache --stacktrace

      # Uploading a version does not touch the project page: syncBodyFrom is driven by its own
      # task, so without this the description stays whatever it was on the first upload.
      - name: Sync the project page from README.md
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinthSyncBody --no-daemon --no-configuration-cache --stacktrace

      # Minotaur has no setting for the one-line summary shown on search cards.
      - name: Sync the project summary
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          summary=$(grep '^modrinthSummary=' gradle.properties | cut -d= -f2-)
          curl -sS --fail-with-body -X PATCH "https://api.modrinth.com/v2/project/jeirecipefix" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg d "$summary" '{description: $d}')"
